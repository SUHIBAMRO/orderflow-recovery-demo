name: orderflow-recovery
x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql://orderflow:${POSTGRES_PASSWORD:?Run setup_env.py}@postgres:5432/orderflow
    MOCK_DATABASE_URL: postgresql://orderflow:${POSTGRES_PASSWORD:?Run setup_env.py}@postgres:5432/orderflow
    TEMPORAL_ADDRESS: temporal:7233
    PROVIDER_URL: http://mock-providers:8081
    PROVIDER_TOKEN: ${PROVIDER_TOKEN:?Run setup_env.py}
    OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Run setup_env.py}
    SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?Run setup_env.py}
    VIEWER_TOKEN: ${VIEWER_TOKEN:?Run setup_env.py}
  init: true
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_DB: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup_env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orderflow -d orderflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  temporal:
    # Local development server, NOT a production Temporal cluster.
    # Pin a validated immutable image digest before deploying elsewhere.
    image: temporalio/temporal:latest
    command: [server, start-dev, --ip, 0.0.0.0, --db-filename, /data/temporal.db]
    volumes: [temporal-data:/data]
    restart: unless-stopped
  migrate:
    <<: *app
    command: [python, -m, orderflow.migrate]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  mock-providers:
    <<: *app
    command: [uvicorn, orderflow.mock_api:app, --host, 0.0.0.0, --port, "8081"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *app
    command: [python, -m, orderflow.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mock-providers: {condition: service_healthy}
      temporal: {condition: service_started}
volumes:
  postgres-data:
  temporal-data:
